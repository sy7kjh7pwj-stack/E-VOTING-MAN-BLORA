<!DOCTYPE html> <html lang="id"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Voting - MAN Blora</title> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: #f0fdfa; color: #0f172a; } header { background: #0f766e; color: white; padding: 18px; } .header { max-width: 900px; margin: auto; display: flex; align-items: center; gap: 15px; } .logo { width: 55px; height: 55px; object-fit: contain; background: white; border-radius: 50%; padding: 3px; } .header h2 { margin: 0; } .header span { font-size: 13px; } .container { max-width: 900px; margin: auto; padding: 30px 20px 50px; } .card { background: white; border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 5px 20px rgba(0,0,0,.07); } h1 { margin-top: 0; } label { display: block; font-weight: bold; margin-bottom: 8px; } input { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 17px; } button { border: 0; border-radius: 9px; padding: 14px 20px; font-weight: bold; cursor: pointer; font-size: 15px; } .btn { width: 100%; background: #0f766e; color: white; margin-top: 15px; } .btn:hover { background: #115e59; } .btn:disabled { background: #94a3b8; } .lanjut { width: 100%; background: #16a34a; color: white; margin-top: 20px; } .hidden { display: none !important; } .error { color: #dc2626; margin-top: 15px; font-weight: bold; } .success { color: #047857; margin-top: 15px; font-weight: bold; } .data { background: #f0fdfa; border-radius: 10px; padding: 16px; margin-top: 20px; } .data p { margin: 8px 0; } .info { background: #eff6ff; color: #1e40af; padding: 15px; border-radius: 10px; margin-top: 15px; } .candidate { border: 2px solid #e2e8f0; border-radius: 14px; padding: 20px; margin-top: 15px; cursor: pointer; } .candidate.selected { border-color: #0f766e; background: #ecfdf5; } .candidate img { width: 120px; height: 120px; object-fit: cover; border-radius: 10px; display: block; margin-bottom: 12px; } .candidate h3 { color: #0f766e; } .vote-button { width: 100%; background: #0f766e; color: white; margin-top: 20px; } </style> </head> <body> <header> <div class="header">

<img
class="logo"
src="../logo-manblora.png"
alt="MAN Blora"
onerror="this.style.display='none'"

<div> <h2>MAN BLORA</h2> <span>E-VOTING PEMILOS</span> </div> </div> </header> <main class="container"> <!-- HALAMAN NISN --> <div class="card" id="loginCard" > <h1>🗳️ Verifikasi Pemilih</h1> <p> Masukkan NISN/NIS untuk melanjutkan ke pemilihan. </p> <label for="nis"> NISN / NIS </label>

<input
id="nis"
type="text"
inputmode="numeric"
placeholder="Masukkan NISN/NIS"

<button
class="btn"
id="cekButton"

CEK NISN / NIS
</button>

<div id="error" class="error" ></div> </div> <!-- DATA PEMILIH --> <div class="card hidden" id="dataCard" > <h1>✅ Data Ditemukan</h1> <div class="data"> <p> <strong>NISN/NIS:</strong> <span id="showNis"></span> </p> <p> <strong>Nama:</strong> <span id="showName"></span> </p> <p> <strong>Kelas:</strong> <span id="showClass"></span> </p> </div> <div class="info"> Pastikan data di atas benar sebelum melanjutkan. </div>

<button
class="lanjut"
id="lanjutButton"

➡️ LANJUT KE PEMILIHAN
</button>

</div> <!-- HALAMAN PEMILIHAN --> <div class="card hidden" id="votingCard" > <h1>🗳️ Pilih Kandidat</h1> <p> Silakan pilih <strong>satu kandidat</strong>. </p> <div id="candidateList"> Memuat kandidat... </div>

<button
class="vote-button"
id="voteButton"

KIRIM SUARA
</button>

<div id="voteMessage" class="success" ></div> </div> </main> <script> /* ========================== SUPABASE ========================== */ const SUPABASE_URL = "https://sfahuouyitpokyocveen.supabase.co"; const SUPABASE_KEY = "sb_publishable_fM4wSbJpKNa9mU-LvX4GVg_kHJCCbfj"; const db = window.supabase.createClient( SUPABASE_URL, SUPABASE_KEY ); let currentVoter = null; let selectedCandidate = null; /* ========================== CEK NISN ========================== */ document .getElementById("cekButton") .addEventListener( "click", cekPemilih ); async function cekPemilih() { const nis = document .getElementById("nis") .value .trim(); const error = document.getElementById("error"); error.textContent = ""; if (!nis) { error.textContent = "Masukkan NISN/NIS terlebih dahulu."; return; } const button = document.getElementById( "cekButton" ); button.disabled = true; button.textContent = "MEMERIKSA..."; const result = await db .from("voters") .select( "id,nis,name,class" ) .eq( "nis", nis ) .maybeSingle(); button.disabled = false; button.textContent = "CEK NISN / NIS"; if (result.error) { error.textContent = "Terjadi kesalahan: " + result.error.message; return; } if (!result.data) { error.textContent = "❌ NISN/NIS tidak terdaftar."; return; } currentVoter = result.data; document .getElementById("showNis") .textContent = result.data.nis; document .getElementById("showName") .textContent = result.data.name; document .getElementById("showClass") .textContent = result.data.class; document .getElementById("loginCard") .classList .add("hidden"); document .getElementById("dataCard") .classList .remove("hidden"); } /* ========================== LANJUT ========================== */ document .getElementById("lanjutButton") .addEventListener( "click", function() { document .getElementById("dataCard") .classList .add("hidden"); document .getElementById("votingCard") .classList .remove("hidden"); loadCandidates(); } ); /* ========================== KANDIDAT ========================== */ async function loadCandidates() { const list = document.getElementById( "candidateList" ); const result = await db .from("candidates") .select( "id,number,name,photo,vision,mission" ) .order( "number", { ascending: true } ); if (result.error) { list.innerHTML = `<div class="error"> Gagal mengambil kandidat:<br> ${escapeHTML(result.error.message)} </div>`; return; } list.innerHTML = ""; result.data.forEach( function(candidate) { const div = document.createElement( "div" ); div.className = "candidate"; div.onclick = function() { selectedCandidate = candidate.id; document .querySelectorAll( ".candidate" ) .forEach( function(item) { item.classList .remove( "selected" ); } ); div.classList .add("selected"); }; let photo = ""; if (candidate.photo) { photo = ` <img src="${escapeHTML(candidate.photo)}" alt="Foto kandidat" > `; } div.innerHTML = ` ${photo} <h3> Nomor ${candidate.number} </h3> <strong> ${escapeHTML(candidate.name)} </strong> <p> <b>Visi:</b><br> ${escapeHTML(candidate.vision || "-")} </p> <p> <b>Misi:</b><br> ${escapeHTML(candidate.mission || "-")} </p> `; list.appendChild(div); } ); } /* ========================== KIRIM SUARA ========================== */ document .getElementById("voteButton") .addEventListener( "click", kirimSuara ); async function kirimSuara() { if (!selectedCandidate) { alert( "Silakan pilih kandidat terlebih dahulu." ); return; } if (!currentVoter) { return; } const yakin = confirm( "Yakin ingin mengirim pilihan ini?" ); if (!yakin) { return; } const button = document.getElementById( "voteButton" ); button.disabled = true; button.textContent = "MENGIRIM..."; const result = await db .from("votes") .insert({ voter_id: currentVoter.id, candidate_id: selectedCandidate }); if (result.error) { button.disabled = false; button.textContent = "KIRIM SUARA"; alert( "Gagal mengirim suara: " + result.error.message ); return; } document .getElementById( "voteMessage" ) .textContent = "✅ Suara berhasil dikirim. Terima kasih."; button.style.display = "none"; } /* ========================== ESCAPE ========================== */ function escapeHTML(value) { return String( value ?? "" ) .replace( /&/g, "&amp;" ) .replace( /</g, "&lt;" ) .replace( />/g, "&gt;" ) .replace( /"/g, "&quot;" ) .replace( /'/g, "&#039;" ); } </script> </body> </html>
