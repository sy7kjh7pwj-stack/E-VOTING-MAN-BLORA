<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Voting MAN Blora</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f0fdfa;
    color:#0f172a;
}

header{
    background:#0f766e;
    color:white;
    padding:20px;
}

main{
    max-width:700px;
    margin:auto;
    padding:25px 15px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 4px 15px #0001;
}

input{
    width:100%;
    padding:14px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:0;
    border-radius:8px;
    background:#0f766e;
    color:white;
    font-weight:bold;
    font-size:16px;
}

.kandidat{
    border:2px solid #ddd;
    border-radius:12px;
    padding:18px;
    margin-top:15px;
    cursor:pointer;
}

.kandidat.dipilih{
    border-color:#0f766e;
    background:#ecfdf5;
}

.kandidat img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:10px;
}

.error{
    color:#dc2626;
    font-weight:bold;
    margin-top:15px;
}

.sukses{
    color:#047857;
    font-weight:bold;
    margin-top:15px;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<header>
    <h2>MAN BLORA</h2>
    <div>E-VOTING PEMILOS</div>
</header>

<main>

<!-- CEK NISN -->

<div class="card" id="formNisn">

    <h1>🗳️ E-Voting</h1>

    <p>Masukkan NISN/NIS untuk mulai memilih.</p>

    <input
        id="nis"
        type="text"
        placeholder="Masukkan NISN/NIS"
    >

    <button onclick="cekNisn()">
        CEK NISN / NIS
    </button>

    <div id="error" class="error"></div>

</div>


<!-- DATA PEMILIH + KANDIDAT -->

<div class="card hidden" id="halamanVoting">

    <h2>Data Pemilih</h2>

    <p>
        <b>NISN/NIS:</b>
        <span id="tNis"></span>
    </p>

    <p>
        <b>Nama:</b>
        <span id="tNama"></span>
    </p>

    <p>
        <b>Kelas:</b>
        <span id="tKelas"></span>
    </p>

    <hr>

    <h2>🗳️ Pilih Kandidat</h2>

    <div id="kandidat">
        Memuat kandidat...
    </div>

    <button onclick="kirim()">
        KIRIM SUARA
    </button>

    <div id="hasil" class="sukses"></div>

</div>

</main>


<script>

const SUPABASE_URL =
"https://sfahuouyitpokyocveen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_fM4wSbJpKNa9mU-LvX4GVg_kHJCCbfj";

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let pemilih = null;
let kandidatDipilih = null;


/* CEK NISN */

async function cekNisn(){

    const nis =
        document
        .getElementById("nis")
        .value
        .trim();

    const error =
        document.getElementById("error");

    error.textContent = "";

    if(!nis){

        error.textContent =
            "Masukkan NISN/NIS.";

        return;
    }


    const hasil =
        await db
        .from("voters")
        .select("id,nis,name,class")
        .eq("nis",nis)
        .maybeSingle();


    if(hasil.error){

        error.textContent =
            hasil.error.message;

        return;
    }


    if(!hasil.data){

        error.textContent =
            "❌ NISN/NIS tidak terdaftar.";

        return;
    }


    pemilih =
        hasil.data;


    document
    .getElementById("tNis")
    .textContent =
        pemilih.nis;

    document
    .getElementById("tNama")
    .textContent =
        pemilih.name;

    document
    .getElementById("tKelas")
    .textContent =
        pemilih.class;


    document
    .getElementById("formNisn")
    .classList
    .add("hidden");


    document
    .getElementById("halamanVoting")
    .classList
    .remove("hidden");


    loadKandidat();
}


/* LOAD KANDIDAT */

async function loadKandidat(){

    const tempat =
        document
        .getElementById("kandidat");


    const hasil =
        await db
        .from("candidates")
        .select(
            "id,number,name,photo,vision,mission"
        )
        .order(
            "number",
            {ascending:true}
        );


    if(hasil.error){

        tempat.innerHTML =
            `<div class="error">
            ${hasil.error.message}
            </div>`;

        return;
    }


    tempat.innerHTML = "";


    hasil.data.forEach(
        function(c){

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "kandidat";


            div.onclick =
                function(){

                    kandidatDipilih =
                        c.id;


                    document
                    .querySelectorAll(
                        ".kandidat"
                    )
                    .forEach(
                        x =>
                        x.classList
                        .remove("dipilih")
                    );


                    div.classList
                    .add("dipilih");

                };


            div.innerHTML = `

                ${
                    c.photo
                    ?
                    `<img src="${c.photo}">`
                    :
                    ""
                }

                <h3>
                    Nomor ${c.number}
                </h3>

                <strong>
                    ${c.name}
                </strong>

                <p>
                    <b>Visi:</b><br>
                    ${c.vision || "-"}
                </p>

                <p>
                    <b>Misi:</b><br>
                    ${c.mission || "-"}
                </p>
            `;


            tempat.appendChild(div);

        }
    );

}


/* KIRIM */

async function kirim(){

    if(!pemilih){

        return;
    }


    if(!kandidatDipilih){

        alert(
            "Pilih kandidat terlebih dahulu."
        );

        return;
    }


    if(
        !confirm(
            "Yakin dengan pilihan kamu?"
        )
    ){

        return;
    }


    const hasil =
        await db
        .from("votes")
        .insert({

            voter_id:
                pemilih.id,

            candidate_id:
                kandidatDipilih

        });


    if(hasil.error){

        alert(
            "Gagal mengirim suara: " +
            hasil.error.message
        );

        return;
    }


    document
    .getElementById("hasil")
    .textContent =
        "✅ Suara berhasil dikirim. Terima kasih.";

}

</script>

</body>
</html>
