<!DOCTYPE html> <html lang="id"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>E-Voting MAN Blora</title> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: #f0fdfa; color: #0f172a; } header { background: #0f766e; color: white; padding: 18px; } .header { max-width: 800px; margin: auto; display: flex; align-items: center; gap: 12px; } .logo { width: 55px; height: 55px; object-fit: contain; background: white; border-radius: 50%; padding: 3px; } main { max-width: 700px; margin: auto; padding: 25px 15px 50px; } .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,.08); } .hidden { display: none !important; } input { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 17px; margin-top: 8px; } button { width: 100%; padding: 14px; margin-top: 15px; border: 0; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; } button:disabled { opacity: .6; cursor: not-allowed; } .btn-hijau { background: #0f766e; color: white; } .btn-lanjut { background: #16a34a; color: white; } .data { background: #f0fdfa; padding: 16px; border-radius: 10px; margin-top: 20px; } .data p { margin: 8px 0; } .error { color: #dc2626; font-weight: bold; margin-top: 15px; } .success { color: #047857; font-weight: bold; margin-top: 15px; } .kandidat { border: 2px solid #e2e8f0; border-radius: 12px; padding: 18px; margin-top: 15px; cursor: pointer; transition: .2s; } .kandidat:hover { border-color: #0f766e; } .kandidat.dipilih { border-color: #0f766e; background: #ecfdf5; } .kandidat img { width: 120px; height: 120px; object-fit: cover; border-radius: 10px; display: block; margin-bottom: 12px; } .kandidat h3 { color: #0f766e; margin-bottom: 8px; } .info { background: #eff6ff; color: #1e40af; padding: 12px; border-radius: 8px; margin-top: 15px; } </style> </head> <body> <header> <div class="header">

<img
class="logo"
src="../logo-manblora.png"
alt="MAN Blora"
onerror="this.style.display='none'"

<div> <strong>MAN BLORA</strong><br> <small>E-VOTING PEMILOS</small> </div> </div> </header> <main> <!-- ========================= STEP 1 - NISN ========================= --> <div class="card" id="step1" > <h1>🗳️ Verifikasi Pemilih</h1> <p> Masukkan NISN/NIS kamu untuk melanjutkan. </p> <label for="nis"> NISN / NIS </label>

<input
id="nis"
type="text"
inputmode="numeric"
autocomplete="off"
placeholder="Masukkan NISN/NIS"

<button
type="button"
class="btn-hijau"
id="btnCek"

CEK NISN / NIS
</button>

<div id="error" class="error" ></div> </div> <!-- ========================= STEP 2 - DATA PEMILIH ========================= --> <div class="card hidden" id="step2" > <h1>✅ Data Pemilih Ditemukan</h1> <div class="data"> <p> <b>NISN/NIS:</b> <span id="dataNis"></span> </p> <p> <b>Nama:</b> <span id="dataNama"></span> </p> <p> <b>Kelas:</b> <span id="dataKelas"></span> </p> </div> <div class="info"> Pastikan data kamu sudah benar sebelum melanjutkan. </div>

<button
type="button"
class="btn-lanjut"
id="btnLanjut"

➡️ LANJUT KE PEMILIHAN
</button>

</div> <!-- ========================= STEP 3 - PEMILIHAN ========================= --> <div class="card hidden" id="step3" > <h1>🗳️ PEMILIHAN</h1> <p> Silakan pilih <b>satu kandidat</b>. </p> <div id="daftarKandidat"> Memuat kandidat... </div>

<button
type="button"
class="btn-hijau"
id="btnKirim"

KIRIM SUARA
</button>

<div id="hasil" class="success" ></div> </div> </main> <script> /* ========================= SUPABASE ========================= */ const SUPABASE_URL = "https://sfahuouyitpokyocveen.supabase.co"; const SUPABASE_KEY = "sb_publishable_fM4wSbJpKNa9mU-LvX4GVg_kHJCCbfj"; const db = window.supabase.createClient( SUPABASE_URL, SUPABASE_KEY ); /* ========================= VARIABLE ========================= */ let pemilih = null; let kandidatDipilih = null; /* ========================= CEK NISN ========================= */ document .getElementById("btnCek") .addEventListener( "click", cekNisn ); async function cekNisn() { const nis = document .getElementById("nis") .value .trim(); const error = document .getElementById("error"); error.textContent = ""; if (!nis) { error.textContent = "Masukkan NISN/NIS terlebih dahulu."; return; } const button = document .getElementById("btnCek"); button.disabled = true; button.textContent = "MEMERIKSA..."; try { const result = await db .from("voters") .select( "id,nis,name,class" ) .eq( "nis", nis ) .maybeSingle(); if (result.error) { error.textContent = "Gagal memeriksa data: " + result.error.message; return; } if (!result.data) { error.textContent = "❌ NISN/NIS tidak terdaftar."; return; } pemilih = result.data; document .getElementById("dataNis") .textContent = pemilih.nis; document .getElementById("dataNama") .textContent = pemilih.name; document .getElementById("dataKelas") .textContent = pemilih.class; document .getElementById("step1") .classList .add("hidden"); document .getElementById("step2") .classList .remove("hidden"); } catch (err) { error.textContent = "Terjadi kesalahan: " + err.message; } finally { button.disabled = false; button.textContent = "CEK NISN / NIS"; } } /* ========================= LANJUT KE PEMILIHAN ========================= */ document .getElementById("btnLanjut") .addEventListener( "click", function() { document .getElementById("step2") .classList .add("hidden"); document .getElementById("step3") .classList .remove("hidden"); loadKandidat(); } ); /* ========================= LOAD KANDIDAT ========================= */ async function loadKandidat() { const tempat = document .getElementById( "daftarKandidat" ); tempat.innerHTML = "Memuat kandidat..."; const result = await db .from("candidates") .select( "id,number,name,photo,vision,mission" ) .order( "number", { ascending: true } ); if (result.error) { tempat.innerHTML = `<div class="error"> Gagal mengambil kandidat:<br> ${escapeHTML(result.error.message)} </div>`; return; } if ( !result.data || result.data.length === 0 ) { tempat.innerHTML = `<div class="error"> Belum ada kandidat. </div>`; return; } tempat.innerHTML = ""; result.data.forEach( function(kandidat) { const div = document.createElement( "div" ); div.className = "kandidat"; /* * INI BUKAN LINK. * KLIK KANDIDAT HANYA MEMILIH. */ div.addEventListener( "click", function() { pilihKandidat( kandidat.id, div ); } ); let foto = ""; if (kandidat.photo) { foto = ` <img src="${escapeHTML(kandidat.photo)}" alt="Foto ${escapeHTML(kandidat.name)}" onerror="this.style.display='none'" > `; } div.innerHTML = ` ${foto} <h3> Nomor ${escapeHTML(kandidat.number)} </h3> <strong> ${escapeHTML(kandidat.name)} </strong> <p> <b>Visi:</b><br> ${escapeHTML( kandidat.vision || "-" )} </p> <p> <b>Misi:</b><br> ${escapeHTML( kandidat.mission || "-" )} </p> `; tempat.appendChild(div); } ); } /* ========================= PILIH KANDIDAT ========================= */ function pilihKandidat( id, element ) { kandidatDipilih = id; document .querySelectorAll( ".kandidat" ) .forEach( function(item) { item.classList .remove( "dipilih" ); } ); element.classList .add( "dipilih" ); } /* ========================= KIRIM SUARA ========================= */ document .getElementById("btnKirim") .addEventListener( "click", kirimSuara ); async function kirimSuara() { if (!pemilih) { alert( "Data pemilih belum ditemukan." ); return; } if (!kandidatDipilih) { alert( "Pilih kandidat terlebih dahulu." ); return; } const yakin = confirm( "Yakin dengan pilihan kamu?" ); if (!yakin) { return; } const button = document .getElementById( "btnKirim" ); button.disabled = true; button.textContent = "MENGIRIM SUARA..."; try { const result = await db .from("votes") .insert({ voter_id: pemilih.id, candidate_id: kandidatDipilih }); if (result.error) { alert( "Gagal mengirim suara: " + result.error.message ); button.disabled = false; button.textContent = "KIRIM SUARA"; return; } document .getElementById( "hasil" ) .textContent = "✅ Suara berhasil dikirim. Terima kasih."; button.style.display = "none"; document .querySelectorAll( ".kandidat" ) .forEach( function(item) { item.style.pointerEvents = "none"; } ); } catch (err) { alert( "Terjadi kesalahan: " + err.message ); button.disabled = false; button.textContent = "KIRIM SUARA"; } } /* ========================= AMANKAN TEKS ========================= */ function escapeHTML(value) { return String( value ?? "" ) .replace( /&/g, "&amp;" ) .replace( /</g, "&lt;" ) .replace( />/g, "&gt;" ) .replace( /"/g, "&quot;" ) .replace( /'/g, "&#039;" ); } </script> </body> </html>
