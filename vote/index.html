<!DOCTYPE html> <html lang="id"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>E-Voting MAN Blora</title> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <style> body { margin: 0; font-family: Arial, sans-serif; background: #f0fdfa; } header { background: #0f766e; color: white; padding: 20px; text-align: center; } main { max-width: 600px; margin: 30px auto; padding: 15px; } .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px #0002; } input { width: 100%; padding: 15px; margin-top: 10px; border: 1px solid #aaa; border-radius: 8px; font-size: 18px; box-sizing: border-box; } button { width: 100%; padding: 15px; margin-top: 15px; border: none; border-radius: 8px; background: #0f766e; color: white; font-size: 17px; font-weight: bold; } .hidden { display: none; } .error { color: red; font-weight: bold; margin-top: 15px; } .data { background: #f0fdfa; padding: 15px; border-radius: 10px; margin-top: 20px; } .kandidat { border: 2px solid #ddd; border-radius: 12px; padding: 18px; margin-top: 15px; } .kandidat.dipilih { border-color: #0f766e; background: #ecfdf5; } .kandidat img { width: 120px; height: 120px; object-fit: cover; border-radius: 10px; } </style> </head> <body> <header> <h2>MAN BLORA</h2> <div>E-VOTING PEMILOS</div> </header> <main> <!-- HALAMAN NISN --> <div class="card" id="halamanNisn">
<h1>🗳️ Verifikasi Pemilih</h1>

<p>Masukkan NISN/NIS kamu.</p>

<input
    id="nis"
    type="text"
    placeholder="Masukkan NISN/NIS"
>

<button
    type="button"
    id="cek"
>
    CEK NISN / NIS
</button>

<div
    id="error"
    class="error"
></div>

</div> <!-- DATA PEMILIH --> <div class="card hidden" id="dataPemilih" >
<h2>✅ Data Pemilih</h2>

<div class="data">

    <p>
        <b>NISN/NIS:</b>
        <span id="nisTampil"></span>
    </p>

    <p>
        <b>Nama:</b>
        <span id="namaTampil"></span>
    </p>

    <p>
        <b>Kelas:</b>
        <span id="kelasTampil"></span>
    </p>

</div>

<button
    type="button"
    id="lanjut"
>
    ➡️ LANJUT KE PEMILIHAN
</button>

</div> <!-- PEMILIHAN --> <div class="card hidden" id="pemilihan" >
<h2>🗳️ Pilih Kandidat</h2>

<div id="kandidat">
    Memuat kandidat...
</div>

<button
    type="button"
    id="kirim"
>
    KIRIM SUARA
</button>

</div> </main> <script> /* ========================== SUPABASE ========================== */ const SUPABASE_URL = "https://sfahuouyitpokyocveen.supabase.co"; const SUPABASE_KEY = "sb_publishable_fM4wSbJpKNa9mU-LvX4GVg_kHJCCbfj"; const db = window.supabase.createClient( SUPABASE_URL, SUPABASE_KEY ); let pemilih = null; let kandidatDipilih = null; /* ========================== TOMBOL CEK NISN ========================== */ document .getElementById("cek") .addEventListener( "click", cekNisn ); async function cekNisn() { const nis = document .getElementById("nis") .value .trim(); const error = document .getElementById("error"); error.textContent = ""; if (nis === "") { error.textContent = "Masukkan NISN/NIS terlebih dahulu."; return; } const hasil = await db .from("voters") .select( "id,nis,name,class" ) .eq( "nis", nis ) .maybeSingle(); if (hasil.error) { error.textContent = "Error: " + hasil.error.message; return; } if (!hasil.data) { error.textContent = "❌ NISN/NIS tidak terdaftar."; return; } pemilih = hasil.data; document .getElementById("nisTampil") .textContent = pemilih.nis; document .getElementById("namaTampil") .textContent = pemilih.name; document .getElementById("kelasTampil") .textContent = pemilih.class; document .getElementById("halamanNisn") .classList .add("hidden"); document .getElementById("dataPemilih") .classList .remove("hidden"); } /* ========================== LANJUT ========================== */ document .getElementById("lanjut") .addEventListener( "click", function() { document .getElementById("dataPemilih") .classList .add("hidden"); document .getElementById("pemilihan") .classList .remove("hidden"); loadKandidat(); } ); /* ========================== KANDIDAT ========================== */ async function loadKandidat() { const tempat = document .getElementById("kandidat"); const hasil = await db .from("candidates") .select( "id,number,name,photo,vision,mission" ) .order( "number", { ascending: true } ); if (hasil.error) { tempat.innerHTML = "<p class='error'>" + hasil.error.message + "</p>"; return; } tempat.innerHTML = ""; hasil.data.forEach( function(k) { const div = document .createElement("div"); div.className = "kandidat"; div.innerHTML = ` ${ k.photo ? `<img src="${k.photo}">` : "" } <h3> Nomor ${k.number} </h3> <b> ${k.name} </b> <p> <b>Visi:</b><br> ${k.vision || "-"} </p> <p> <b>Misi:</b><br> ${k.mission || "-"} </p> `; div.onclick = function() { kandidatDipilih = k.id; document .querySelectorAll( ".kandidat" ) .forEach( function(x) { x.classList .remove( "dipilih" ); } ); div.classList .add("dipilih"); }; tempat.appendChild(div); } ); } /* ========================== KIRIM ========================== */ document .getElementById("kirim") .addEventListener( "click", kirimSuara ); async function kirimSuara() { if (!kandidatDipilih) { alert( "Pilih kandidat terlebih dahulu." ); return; } const yakin = confirm( "Yakin dengan pilihan kamu?" ); if (!yakin) { return; } const hasil = await db .from("votes") .insert({ voter_id: pemilih.id, candidate_id: kandidatDipilih }); if (hasil.error) { alert( "Gagal menyimpan suara: " + hasil.error.message ); return; } alert( "✅ Suara berhasil dikirim!" ); document .getElementById("kirim") .style.display = "none"; } </script> </body> </html>
