<!DOCTYPE html> <html lang="id"> <head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login Admin - E-Voting MAN Blora</title>

<link
    rel="stylesheet"
    href="../css/style.css"
>

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

</head> <body> <header class="navbar">
<div class="brand">

    <img
        src="../logo-manblora.png"
        alt="Logo MAN Blora"
    >

    <div>

        <h2>MAN BLORA</h2>

        <span>ADMIN E-VOTING</span>

    </div>

</div>

</header> <main> <section class="qr-section">
<div
    class="qr-card"
    style="max-width:500px;"
>

    <div class="badge">
        ADMIN
    </div>


    <h1 style="margin-bottom:15px;">
        Login Admin
    </h1>


    <p>
        Masuk menggunakan akun admin
        yang terdaftar di sistem.
    </p>


    <form id="loginForm">


        <input
            id="email"
            type="email"
            placeholder="Email admin"
            autocomplete="email"
            required

            style="
                width:100%;
                padding:15px;
                border:1px solid #cbd5e1;
                border-radius:10px;
                font-size:16px;
                margin-bottom:15px;
            "
        >


        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required

            style="
                width:100%;
                padding:15px;
                border:1px solid #cbd5e1;
                border-radius:10px;
                font-size:16px;
                margin-bottom:15px;
            "
        >


        <button
            id="loginButton"
            type="submit"
            class="btn-primary"

            style="
                width:100%;
                border:0;
                cursor:pointer;
                font-size:16px;
            "
        >
            LOGIN ADMIN
        </button>


    </form>


    <div
        id="message"

        style="
            margin-top:20px;
            font-weight:bold;
        "
    ></div>


</div>

</section> </main> <footer>
© 2026 MAN Blora — Admin E-Voting

</footer> <script> /* ======================================== SUPABASE ======================================== */ const SUPABASE_URL = "https://sfahuouyitpokyocveen.supabase.co"; const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fM4wSbJpKNa9mU-LvX4GVg_kHJCCbfj"; const supabaseClient = window.supabase.createClient( SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY ); /* ======================================== ELEMENT ======================================== */ const form = document.getElementById( "loginForm" ); const message = document.getElementById( "message" ); const button = document.getElementById( "loginButton" ); /* ======================================== CEK SESSION ======================================== */ checkSession(); async function checkSession() { const { data } = await supabaseClient .auth .getSession(); if ( data && data.session ) { window.location.href = "dashboard.html"; } } /* ======================================== LOGIN ======================================== */ form.addEventListener( "submit", async function(event) { event.preventDefault(); const email = document .getElementById("email") .value .trim(); const password = document .getElementById("password") .value; button.disabled = true; button.textContent = "LOGIN..."; message.textContent = "Memeriksa akun..."; message.style.color = "#0f766e"; const { data, error } = await supabaseClient .auth .signInWithPassword({ email: email, password: password }); if (error) { console.error(error); message.textContent = "Email atau password salah."; message.style.color = "#dc2626"; button.disabled = false; button.textContent = "LOGIN ADMIN"; return; } if ( data && data.session ) { message.textContent = "Login berhasil..."; message.style.color = "#0f766e"; setTimeout( function() { window.location.href = "dashboard.html"; }, 500 ); } } ); </script> </body> </html>
