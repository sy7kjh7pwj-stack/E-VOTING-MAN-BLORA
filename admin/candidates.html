<!DOCTYPE html> <html lang="id"> <head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Kelola Kandidat - MAN Blora</title>

<link
    rel="stylesheet"
    href="../css/style.css"
>

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<style>

    .admin-container {
        max-width: 1100px;
        margin: auto;
        padding: 40px 20px 80px;
    }

    .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 30px;
    }

    .admin-header h1 {
        margin: 10px 0;
    }

    .back-btn {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 10px;
        background: #e2e8f0;
        color: #0f172a;
        text-decoration: none;
        font-weight: bold;
    }

    .panel {
        background: white;
        padding: 25px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(15,23,42,.06);
        margin-bottom: 25px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group.full {
        grid-column: 1 / -1;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 13px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 15px;
        font-family: inherit;
    }

    .form-group textarea {
        min-height: 110px;
        resize: vertical;
    }

    .candidate-list {
        display: grid;
        gap: 15px;
    }

    .candidate-item {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 18px;
        border: 1px solid #e2e8f0;
        border-radius: 15px;
    }

    .candidate-photo {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: cover;
        background: #e2e8f0;
    }

    .candidate-info {
        flex: 1;
    }

    .candidate-info h3 {
        margin-bottom: 5px;
    }

    .candidate-info p {
        color: #64748b;
        font-size: 14px;
        margin: 4px 0;
    }

    .delete-btn {
        border: 0;
        padding: 10px 14px;
        border-radius: 9px;
        background: #fee2e2;
        color: #991b1b;
        cursor: pointer;
        font-weight: bold;
    }

    .message {
        margin-top: 15px;
        font-weight: bold;
    }

    @media (max-width: 700px) {

        .form-grid {
            grid-template-columns: 1fr;
        }

        .form-group.full {
            grid-column: auto;
        }

        .candidate-item {
            flex-direction: column;
            align-items: flex-start;
        }

        .admin-header {
            flex-direction: column;
            align-items: flex-start;
        }

    }

</style>

</head> <body> <header class="navbar">
<div class="brand">

    <img
        src="../logo-manblora.png"
        alt="Logo MAN Blora"
    >

    <div>

        <h2>MAN BLORA</h2>

        <span>ADMIN E-VOTING</span>

    </div>

</div>

</header> <main> <div class="admin-container">
<div class="admin-header">

    <div>

        <div class="badge">
            ADMIN PANEL
        </div>

        <h1>
            Kelola Kandidat
        </h1>

        <p style="color:#64748b;">
            Tambah dan hapus kandidat PEMILOS.
        </p>

    </div>


    <a
        href="dashboard.html"
        class="back-btn"
    >
        ← Dashboard
    </a>

</div>


<!-- FORM TAMBAH -->

<div class="panel">

    <h2>
        ➕ Tambah Kandidat
    </h2>

    <br>


    <form id="candidateForm">


        <div class="form-grid">


            <div class="form-group">

                <label>
                    Nomor Kandidat
                </label>

                <input
                    id="number"
                    type="number"
                    min="1"
                    placeholder="Contoh: 1"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Nama Kandidat
                </label>

                <input
                    id="name"
                    type="text"
                    placeholder="Contoh: Ahmad"
                    required
                >

            </div>


            <div class="form-group full">

                <label>
                    URL Foto
                </label>

                <input
                    id="photo"
                    type="url"
                    placeholder="https://..."
                >

            </div>


            <div class="form-group full">

                <label>
                    Visi
                </label>

                <textarea
                    id="vision"
                    placeholder="Tuliskan visi kandidat..."
                ></textarea>

            </div>


            <div class="form-group full">

                <label>
                    Misi
                </label>

                <textarea
                    id="mission"
                    placeholder="Tuliskan misi kandidat..."
                ></textarea>

            </div>


        </div>


        <button
            type="submit"
            class="btn-primary"
            style="
                border:0;
                cursor:pointer;
            "
        >
            SIMPAN KANDIDAT
        </button>


    </form>


    <div
        id="message"
        class="message"
    ></div>

</div>


<!-- DAFTAR -->

<div class="panel">

    <h2>
        📋 Daftar Kandidat
    </h2>

    <br>


    <div
        id="candidateList"
        class="candidate-list"
    >
        Memuat...
    </div>

</div>

</div> </main> <footer>
© 2026 MAN Blora — Admin E-Voting

</footer> <script> /* ======================================== SUPABASE ======================================== */ const SUPABASE_URL = "https://sfahuouyitpokyocveen.supabase.co"; const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fM4wSbJpKNa9mU-LvX4GVg_kHJCCbfj"; const supabaseClient = window.supabase.createClient( SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY ); /* ======================================== CEK LOGIN ======================================== */ checkLogin(); async function checkLogin() { const { data } = await supabaseClient .auth .getSession(); if ( !data.session ) { window.location.href = "./"; } } /* ======================================== ELEMENT ======================================== */ const form = document.getElementById( "candidateForm" ); const message = document.getElementById( "message" ); const list = document.getElementById( "candidateList" ); /* ======================================== TAMBAH KANDIDAT ======================================== */ form.addEventListener( "submit", async function(event) { event.preventDefault(); const number = Number( document .getElementById("number") .value ); const name = document .getElementById("name") .value .trim(); const photo = document .getElementById("photo") .value .trim(); const vision = document .getElementById("vision") .value .trim(); const mission = document .getElementById("mission") .value .trim(); message.textContent = "Menyimpan..."; message.style.color = "#0f766e"; const { error } = await supabaseClient .from("candidates") .insert({ number: number, name: name, photo: photo || null, vision: vision || null, mission: mission || null }); if (error) { console.error(error); message.textContent = "Gagal menyimpan kandidat."; message.style.color = "#dc2626"; return; } message.textContent = "Kandidat berhasil ditambahkan."; message.style.color = "#0f766e"; form.reset(); loadCandidates(); } ); /* ======================================== LOAD KANDIDAT ======================================== */ async function loadCandidates() { const { data, error } = await supabaseClient .from("candidates") .select( "id, number, name, photo, vision, mission" ) .order( "number", { ascending: true } ); if (error) { console.error(error); list.innerHTML = ` <p style="color:#dc2626;"> Gagal mengambil data kandidat. </p> `; return; } if ( !data || data.length === 0 ) { list.innerHTML = ` <p style="color:#64748b;"> Belum ada kandidat. </p> `; return; } list.innerHTML = ""; data.forEach( candidate => { const item = document.createElement( "div" ); item.className = "candidate-item"; const photo = candidate.photo || "../logo-manblora.png"; item.innerHTML = ` <img src="${escapeHTML(photo)}" class="candidate-photo" alt="${escapeHTML(candidate.name)}" > <div class="candidate-info"> <h3> No. ${candidate.number} — ${escapeHTML(candidate.name)} </h3> <p> <strong>Visi:</strong> ${escapeHTML(candidate.vision || "-")} </p> <p> <strong>Misi:</strong> ${escapeHTML(candidate.mission || "-")} </p> </div> <button class="delete-btn" onclick="deleteCandidate('${candidate.id}')" > Hapus </button> `; list.appendChild(item); } ); } /* ======================================== HAPUS KANDIDAT ======================================== */ async function deleteCandidate( id ) { const yakin = confirm( "Yakin ingin menghapus kandidat ini?" ); if (!yakin) { return; } const { error } = await supabaseClient .from("candidates") .delete() .eq( "id", id ); if (error) { console.error(error); alert( "Kandidat gagal dihapus." ); return; } loadCandidates(); } /* ======================================== ESCAPE HTML ======================================== */ function escapeHTML( text ) { return String(text) .replace( /&/g, "&amp;" ) .replace( /</g, "&lt;" ) .replace( />/g, "&gt;" ) .replace( /"/g, "&quot;" ) .replace( /'/g, "&#039;" ); } loadCandidates(); </script> </body> </html>
