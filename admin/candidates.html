<!DOCTYPE html> <html lang="id"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Admin Kandidat - E-Voting MAN Blora</title> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; color: #0f172a; } .header { background: #0f766e; color: white; padding: 20px; } .header-inner { max-width: 1000px; margin: auto; display: flex; justify-content: space-between; align-items: center; } .header h2 { margin: 0; } .back { background: white; color: #0f766e; padding: 10px 15px; border-radius: 8px; text-decoration: none; font-weight: bold; } .container { max-width: 1000px; margin: auto; padding: 25px 20px 50px; } .card { background: white; border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 5px 20px rgba(0,0,0,.06); } .kandidat { border: 1px solid #dbeafe; border-radius: 12px; padding: 20px; margin-top: 20px; } .kandidat h2 { color: #0f766e; margin-top: 0; } label { display: block; font-weight: bold; margin-top: 15px; margin-bottom: 7px; } input, textarea { width: 100%; padding: 13px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; font-family: Arial, sans-serif; } textarea { min-height: 110px; resize: vertical; } button { border: 0; border-radius: 8px; padding: 13px 18px; margin-top: 18px; background: #0f766e; color: white; font-weight: bold; cursor: pointer; } button:hover { background: #115e59; } .status { margin-top: 12px; font-weight: bold; } .berhasil { color: #047857; } .gagal { color: #dc2626; } .loading { text-align: center; padding: 30px; } </style> </head> <body> <header class="header"> <div class="header-inner"> <div> <h2>MAN BLORA</h2> <div>ADMIN E-VOTING</div> </div> <a class="back" href="./"> ← Admin </a> </div> </header> <main class="container"> <div class="card"> <h1>👤 Kelola Kandidat</h1> <p> Di sini admin dapat mengubah data 3 kandidat. </p> </div> <div id="kandidatContainer"> <div class="card loading"> Memuat kandidat... </div> </div> </main> <script> /* ========================= SUPABASE ========================= */ const SUPABASE_URL = "https://sfahuouyitpokyocveen.supabase.co"; const SUPABASE_KEY = "sb_publishable_fM4wSbJpKNa9mU-LvX4GVg_kHJCCbfj"; const supabaseClient = window.supabase.createClient( SUPABASE_URL, SUPABASE_KEY ); /* ========================= LOAD KANDIDAT ========================= */ async function loadKandidat() { const container = document.getElementById( "kandidatContainer" ); const response = await supabaseClient .from("candidates") .select( "id,number,name,photo,vision,mission" ) .order( "number", { ascending: true } ); if (response.error) { container.innerHTML = ` <div class="card gagal"> Gagal mengambil kandidat:<br><br> ${escapeHTML(response.error.message)} </div> `; return; } const kandidat = response.data || []; if (kandidat.length === 0) { container.innerHTML = ` <div class="card"> Belum ada kandidat. </div> `; return; } container.innerHTML = ""; kandidat.forEach(function(item) { const box = document.createElement("div"); box.className = "kandidat"; box.innerHTML = ` <h2> Kandidat ${item.number} </h2> <label> Nama Kandidat </label> <input id="name-${item.id}" value="${escapeAttribute(item.name)}" placeholder="Nama kandidat" > <label> Link Foto </label> <input id="photo-${item.id}" value="${escapeAttribute(item.photo)}" placeholder="https://contoh.com/foto.jpg" > <label> Visi </label> <textarea id="vision-${item.id}" placeholder="Tuliskan visi kandidat..." >${escapeHTML(item.vision)}</textarea> <label> Misi </label> <textarea id="mission-${item.id}" placeholder="Tuliskan misi kandidat..." >${escapeHTML(item.mission)}</textarea> <button onclick="simpan('${item.id}')" > 💾 SIMPAN KANDIDAT </button> <div id="status-${item.id}" class="status" ></div> `; container.appendChild(box); }); } /* ========================= SIMPAN KANDIDAT ========================= */ async function simpan(id) { const status = document.getElementById( "status-" + id ); const name = document.getElementById( "name-" + id ).value.trim(); const photo = document.getElementById( "photo-" + id ).value.trim(); const vision = document.getElementById( "vision-" + id ).value.trim(); const mission = document.getElementById( "mission-" + id ).value.trim(); status.textContent = "Menyimpan..."; status.className = "status"; const response = await supabaseClient .from("candidates") .update({ name: name, photo: photo, vision: vision, mission: mission }) .eq("id", id); if (response.error) { status.textContent = "❌ Gagal menyimpan kandidat: " + response.error.message; status.className = "status gagal"; return; } status.textContent = "✅ Kandidat berhasil disimpan."; status.className = "status berhasil"; } /* ========================= AMANKAN TEKS ========================= */ function escapeHTML(value) { return String(value || "") .replace(/&/g, "&amp;") .replace(/</g, "&lt;") .replace(/>/g, "&gt;") .replace(/"/g, "&quot;") .replace(/'/g, "&#039;"); } function escapeAttribute(value) { return escapeHTML(value); } /* ========================= JALANKAN ========================= */ loadKandidat(); </script> </body> </html>
