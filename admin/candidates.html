</div> </main> <script> /* ============================ SUPABASE ============================ */ const SUPABASE_URL = "https://sfahuouyitpokyocveen.supabase.co"; const SUPABASE_KEY = "sb_publishable_fM4wSbJpKNa9mU-LvX4GVg_kHJCCbfj"; const supabaseClient = window.supabase.createClient( SUPABASE_URL, SUPABASE_KEY ); /* ============================ LOAD KANDIDAT ============================ */ async function loadKandidat() { const container = document.getElementById( "kandidatContainer" ); const result = await supabaseClient .from("candidates") .select( "id,number,name,photo,vision,mission" ) .order( "number", { ascending: true } ); if (result.error) { container.innerHTML = ` <div class="card error"> Gagal mengambil kandidat:<br> ${result.error.message} </div> `; return; } container.innerHTML = ""; result.data.forEach( function(kandidat) { const div = document.createElement( "div" ); div.className = "kandidat"; div.innerHTML = ` <h2> Kandidat ${kandidat.number} </h2> <label> Nama Kandidat </label> <input id="name-${kandidat.id}" value="${escapeHTML(kandidat.name || "")}" > <label> Link Foto </label> <input id="photo-${kandidat.id}" value="${escapeHTML(kandidat.photo || "")}" placeholder="https://..." > <label> Visi </label> <textarea id="vision-${kandidat.id}" >${escapeHTML(kandidat.vision || "")}</textarea> <label> Misi </label> <textarea id="mission-${kandidat.id}" >${escapeHTML(kandidat.mission || "")}</textarea> <button class="simpan" onclick="simpanKandidat('${kandidat.id}')" > 💾 SIMPAN KANDIDAT </button> <div id="hasil-${kandidat.id}" class="hasil" ></div> `; container.appendChild(div); } ); } /* ============================ SIMPAN ============================ */ async function simpanKandidat(id) { const hasil = document.getElementById( "hasil-" + id ); const name = document.getElementById( "name-" + id ).value.trim(); const photo = document.getElementById( "photo-" + id ).value.trim(); const vision = document.getElementById( "vision-" + id ).value.trim(); const mission = document.getElementById( "mission-" + id ).value.trim(); hasil.textContent = "Menyimpan..."; hasil.className = "hasil"; const result = await supabaseClient .from("candidates") .update({ name: name, photo: photo, vision: vision, mission: mission }) .eq( "id", id ); if (result.error) { console.error( result.error ); hasil.textContent = "Gagal menyimpan kandidat: " + result.error.message; hasil.className = "hasil error"; return; } hasil.textContent = "✓ Kandidat berhasil disimpan."; hasil.className = "hasil success"; } /* ============================ ESCAPE ============================ */ function escapeHTML(value) { return String( value ?? "" ) .replace( /&/g, "&amp;" ) .replace( /</g, "&lt;" ) .replace( />/g, "&gt;" ) .replace( /"/g, "&quot;" ) .replace( /'/g, "&#039;" ); } /* ============================ MULAI ============================ */ loadKandidat(); </script> </body> </html>
