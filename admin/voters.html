<!DOCTYPE html> <html lang="id"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Tambah Pemilih - E-Voting MAN Blora</title> <style> body{ margin:0; font-family:Arial,sans-serif; background:#f1f5f9; } .header{ background:#0f766e; color:white; padding:20px; } .container{ max-width:900px; margin:30px auto; padding:0 20px; } .card{ background:white; padding:25px; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,.08); } h1{ margin-top:0; } .form-group{ margin-bottom:18px; } label{ display:block; font-weight:bold; margin-bottom:7px; } input{ width:100%; padding:14px; border:1px solid #cbd5e1; border-radius:8px; font-size:16px; } button{ padding:14px 20px; border:0; border-radius:8px; background:#0f766e; color:white; font-weight:bold; cursor:pointer; } #hasil{ margin-top:20px; padding:15px; border-radius:8px; background:#ecfdf5; color:#065f46; } </style> </head> <body> <div class="header"> <strong>MAN BLORA — ADMIN E-VOTING</strong> </div> <div class="container"> <div class="card"> <h1>Tambah Pemilih</h1> <p>Silakan isi data pemilih.</p> <form id="formPemilih"> <div class="form-group"> <label for="nis">NISN / NIS</label> <input id="nis" type="text" placeholder="Masukkan NISN / NIS" autocomplete="off" required > </div> <div class="form-group"> <label for="nama">Nama</label> <input id="nama" type="text" placeholder="Masukkan nama" autocomplete="off" required > </div> <div class="form-group"> <label for="kelas">Kelas</label> <input id="kelas" type="text" placeholder="Contoh: XII IPA 1" autocomplete="off" required > </div> <button type="submit"> SIMPAN PEMILIH </button> </form> <div id="hasil"></div> </div> </div> <script> document .getElementById("formPemilih") .addEventListener("submit", function(event){ event.preventDefault(); const nis = document.getElementById("nis").value; const nama = document.getElementById("nama").value; const kelas = document.getElementById("kelas").value; document.getElementById("hasil").innerHTML = "Data diterima: " + nis + " — " + nama + " — " + kelas; }); </script> </body> </html>
