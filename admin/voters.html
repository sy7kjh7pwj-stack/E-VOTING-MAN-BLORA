<!DOCTYPE html> <html lang="id"> <head> <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

<title>Kelola Pemilih - MAN Blora</title> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: #f0fdfa; color: #0f172a; } .header { background: #0f766e; color: white; padding: 20px; } .header-inner { max-width: 1100px; margin: auto; display: flex; justify-content: space-between; align-items: center; } .header h2 { margin: 0; } .container { max-width: 1100px; margin: auto; padding: 30px 20px; } .back { color: white; text-decoration: none; background: #115e59; padding: 10px 15px; border-radius: 8px; } .card { background: white; padding: 25px; border-radius: 15px; margin-bottom: 25px; box-shadow: 0 5px 20px rgba(0,0,0,.06); } .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; } label { display: block; font-weight: bold; margin-bottom: 7px; } input { width: 100%; padding: 13px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; } button { border: 0; border-radius: 8px; padding: 12px 18px; cursor: pointer; font-weight: bold; } .save { margin-top: 15px; background: #0f766e; color: white; } .delete { background: #fee2e2; color: #991b1b; } .reset { background: #dbeafe; color: #1e40af; margin-right: 5px; } .search { margin: 15px 0; } table { width: 100%; border-collapse: collapse; } th, td { padding: 13px 10px; border-bottom: 1px solid #e2e8f0; text-align: left; } th { background: #f8fafc; } .status { padding: 6px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; } .yes { background: #dcfce7; color: #166534; } .no { background: #fef3c7; color: #92400e; } .message { margin-top: 15px; font-weight: bold; } @media(max-width:700px) { .header-inner { flex-direction: column; gap: 15px; align-items: flex-start; } .form-grid { grid-template-columns: 1fr; } .table-wrapper { overflow-x: auto; } table { min-width: 700px; } } </style> </head> <body> <header class="header"> <div class="header-inner"> <div> <h2>MAN BLORA</h2> <div>E-VOTING — ADMIN</div> </div>

<a
href="dashboard.html"
class="back"

← Dashboard
</a>

</div> </header> <div class="container"> <div class="card"> <h1> 👨‍🎓 Kelola Pemilih </h1> <p> Tambah dan kelola peserta pemilihan. </p> </div> <div class="card"> <h2> ➕ Tambah Pemilih </h2> <form id="voterForm"> <div class="form-grid"> <div> <label> No Peserta </label>

<input
id="noPeserta"
type="text"
placeholder="Contoh: 001"
required

</div> <div> <label> Nama </label>

<input
id="nama"
type="text"
placeholder="Nama lengkap"
required

</div> </div>

<button
type="submit"
class="save"
id="saveButton"

Simpan Pemilih
</button>

<div id="message" class="message" ></div> </form> </div> <div class="card"> <h2> 📋 Daftar Pemilih </h2>

<input
id="search"
class="search"
type="search"
placeholder="🔎 Cari nomor peserta atau nama..."

<div class="table-wrapper"> <table> <thead> <tr> <th> No </th> <th> No Peserta </th> <th> Nama </th> <th> Status </th> <th> Aksi </th> </tr> </thead> <tbody id="voterTable"> <tr> <td colspan="5" style="text-align:center" > Memuat... </td> </tr> </tbody> </table> </div> </div> </div> <script> /* ========================= SUPABASE ========================= */ const SUPABASE_URL = "https://sfahuouyitpokyocveen.supabase.co"; const SUPABASE_KEY = "sb_publishable_fM4wSbJpKNa9mU-LvX4GVg_kHJCCbfj"; const supabaseClient = window.supabase.createClient( SUPABASE_URL, SUPABASE_KEY ); /* ========================= DATA ========================= */ let voters = []; /* ========================= CEK LOGIN ========================= */ async function checkLogin() { const { data, error } = await supabaseClient .auth .getSession(); if ( error || !data.session ) { window.location.href = "./"; return false; } return true; } /* ========================= AMBIL DATA ========================= */ async function loadVoters() { const table = document.getElementById( "voterTable" ); const { data, error } = await supabaseClient .from("voters") .select( '"id", "no peserta", "nama", "sudah memilih"' ) .order( "id", { ascending: true } ); if (error) { console.error(error); table.innerHTML = ` <tr> <td colspan="5" style=" text-align:center; color:red; padding:25px; " > Gagal mengambil data: ${escapeHTML(error.message)} </td> </tr> `; return; } voters = data || []; renderVoters(); } /* ========================= TAMPILKAN DATA ========================= */ function renderVoters() { const table = document.getElementById( "voterTable" ); const keyword = document.getElementById( "search" ) .value .toLowerCase() .trim(); const filtered = voters.filter( voter => { const noPeserta = String( voter["no peserta"] || "" ) .toLowerCase(); const nama = String( voter["nama"] || "" ) .toLowerCase(); return ( noPeserta.includes(keyword) || nama.includes(keyword) ); } ); if ( filtered.length === 0 ) { table.innerHTML = ` <tr> <td colspan="5" style=" text-align:center; padding:30px; color:#64748b; " > Belum ada data pemilih. </td> </tr> `; return; } table.innerHTML = ""; filtered.forEach( (voter, index) => { const sudahMemilih = voter["sudah memilih"]; const status = sudahMemilih ? ` <span class="status yes"> ✓ Sudah Memilih </span> ` : ` <span class="status no"> Belum Memilih </span> `; const row = document.createElement( "tr" ); row.innerHTML = ` <td> ${index + 1} </td> <td> ${escapeHTML( voter["no peserta"] )} </td> <td> ${escapeHTML( voter["nama"] )} </td> <td> ${status} </td> <td> ${ sudahMemilih ? ` <button class="reset" onclick="resetVoting('${voter.id}')" > Reset </button> ` : "" } <button class="delete" onclick="deleteVoter('${voter.id}')" > Hapus </button> </td> `; table.appendChild( row ); } ); } /* ========================= TAMBAH PEMILIH ========================= */ document .getElementById("voterForm") .addEventListener( "submit", addVoter ); async function addVoter(event) { event.preventDefault(); const noPeserta = document .getElementById("noPeserta") .value .trim(); const nama = document .getElementById("nama") .value .trim(); const message = document.getElementById( "message" ); const button = document.getElementById( "saveButton" ); if ( !noPeserta || !nama ) { message.textContent = "Nomor peserta dan nama wajib diisi."; message.style.color = "red"; return; } button.disabled = true; button.textContent = "Menyimpan..."; message.textContent = ""; const { error } = await supabaseClient .from("voters") .insert({ "no peserta": noPeserta, "nama": nama, "sudah memilih": false }); if (error) { console.error(error); message.textContent = "Gagal menyimpan: " + error.message; message.style.color = "red"; button.disabled = false; button.textContent = "Simpan Pemilih"; return; } message.textContent = "✓ Pemilih berhasil ditambahkan."; message.style.color = "#0f766e"; document .getElementById( "voterForm" ) .reset(); button.disabled = false; button.textContent = "Simpan Pemilih"; await loadVoters(); } /* ========================= RESET VOTING ========================= */ async function resetVoting(id) { const yakin = confirm( "Reset status pemilih ini?" ); if (!yakin) { return; } const { error } = await supabaseClient .from("voters") .update({ "sudah memilih": false }) .eq( "id", id ); if (error) { alert( "Gagal reset: " + error.message ); return; } alert( "Status berhasil direset." ); await loadVoters(); } /* ========================= HAPUS PEMILIH ========================= */ async function deleteVoter(id) { const yakin = confirm( "Yakin ingin menghapus pemilih ini?" ); if (!yakin) { return; } const { error } = await supabaseClient .from("voters") .delete() .eq( "id", id ); if (error) { alert( "Gagal menghapus: " + error.message ); return; } await loadVoters(); } /* ========================= SEARCH ========================= */ document .getElementById("search") .addEventListener( "input", renderVoters ); /* ========================= ESCAPE HTML ========================= */ function escapeHTML(value) { return String( value ?? "" ) .replace( /&/g, "&amp;" ) .replace( /</g, "&lt;" ) .replace( />/g, "&gt;" ) .replace( /"/g, "&quot;" ) .replace( /'/g, "&#039;" ); } /* ========================= START ========================= */ (async function() { const loggedIn = await checkLogin(); if (loggedIn) { await loadVoters(); } })(); </script> </body> </html>
